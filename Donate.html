<!DOCTYPE html>
<html lang="en">
<head>
<style>

.donate {
  padding: 60px 20px;
  text-align: center;
  background: #f7f9fb;
}

.donate h2 {
  color: #123b5d;
  font-size: 32px;
  margin-bottom: 8px;
}

.donate > p {
  color: #666;
  margin-bottom: 30px;
}

.donate-box {
  max-width: 850px;
  margin: auto;
  display: flex;
  justify-content: center;
  gap: 40px;
  background: white;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

.donate-qr,
.bank-details {
  flex: 1;
}

.donate h3 {
  color: #d47b00;
  margin-bottom: 15px;
}

.donate-qr img {
  width: 180px;
  height: 180px;
  object-fit: contain;
  border: 1px solid #ddd;
  padding: 8px;
  border-radius: 8px;
}

.donate-qr p {
  color: #555;
}

.bank-details {
  text-align: left;
  padding: 10px;
}

.bank-details p {
  color: #555;
  line-height: 1.5;
  margin-bottom: 12px;
}

.bank-details strong {
  color: #123b5d;
}

.donate-note {
  margin-top: 25px;
  color: #d47b00;
  font-weight: 600;
}


/* MOBILE */
@media (max-width: 650px) {

  .donate-box {
    flex-direction: column;
    gap: 20px;
    padding: 20px;
  }

  .bank-details {
    text-align: center;
  }

  .donate h2 {
    font-size: 28px;
  }
}
.home-btn{
    display:inline-block;
    background:#0B4F6C;
    color:#fff;
    text-decoration:none;
    padding:12px 28px;
    border-radius:50px;
    font-size:16px;
    font-weight:600;
    transition:0.3s ease;
    box-shadow:0 6px 15px rgba(11,79,108,0.25);
}

.home-btn:hover{
    background:#083B50;
    transform:translateY(-3px);
    box-shadow:0 10px 20px rgba(11,79,108,0.35);
}

.home-btn:active{
    transform:translateY(0);
}
</style>
</head>
<body>

<!-- ================= DONATE SECTION ================= -->
<section class="donate" id="donate">

  <h2>Support Our Cause</h2>
  <p>Your contribution can help us make a difference.</p>

  <div class="donate-box">

    <!-- QR CODE -->
    <div class="donate-qr">
      <h3>Donate via UPI</h3>

      <!-- Replace qr-code.png with your QR image -->
      <img src="qr.JPG" alt="Vandan Foundation UPI QR Code">

    </div>

    <!-- BANK DETAILS -->
    <div class="bank-details">
      <h3>Bank Details</h3>

      <p><strong>Account Name:</strong><br>
        Vandan Foundation Seva Trust
      </p>

      <p><strong>Account Number:</strong><br>
        924020054160986
      </p>

      <p><strong>IFSC Code:</strong><br>
        UTIB0003593
      </p>

      <p><strong>BANK:</strong><br>
        AXIS BANK
      </p>
    </div>

  </div>

<div style="text-align:center; margin-top:35px;">
    <a href="index.html" class="home-btn">← Back to Home</a>

</section>



</body>
</html>
